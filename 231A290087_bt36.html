<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bài tập 36 - Mini game web</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px; font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #eef5ff, #f7f8fc); color: #243047;
  }
  .page { width: min(620px, 100%); text-align: center; }
  h1 { margin: 0 0 8px; color: #2457c5; font-size: clamp(24px, 5vw, 32px); }
  .subtitle { margin: 0 0 18px; color: #596579; }
  .status {
    display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px;
  }
  .pill {
    background: #fff; border: 1px solid #dce5f5; border-radius: 12px;
    padding: 10px 18px; min-width: 120px; box-shadow: 0 4px 12px #2430470b;
    font-weight: 700;
  }
  .pill span { color: #2457c5; }
  #game-container {
    position: relative; width: 500px; height: 400px; max-width: 100%;
    margin: 0 auto; overflow: hidden; border-radius: 16px;
    border: 3px solid #c8d5e8; background: linear-gradient(#e8f6ff 0%, #f7fbff 75%, #e4f3df 75%, #e4f3df 100%);
    box-shadow: 0 12px 30px #223a5b20;
  }
  #game-container::before {
    content: ""; position: absolute; left: 0; right: 0; top: 74%; border-top: 2px dashed #a9c89c;
  }
  #basket {
    position: absolute; width: 76px; height: 32px; bottom: 12px; left: 212px;
    background: #9b5c2f; border: 3px solid #70401f; border-top: 5px solid #c8874b;
    border-radius: 5px 5px 18px 18px; box-shadow: inset 0 -5px #78421f;
  }
  #basket::before, #basket::after {
    content: ""; position: absolute; top: -8px; width: 4px; height: 34px;
    background: #70401f; border-radius: 4px;
  }
  #basket::before { left: 18px; } #basket::after { right: 18px; }
  #apple {
    position: absolute; top: 18px; left: 100px; width: 28px; height: 28px;
    border-radius: 48% 48% 45% 45%; background: #e83f4f;
    box-shadow: inset -5px -4px #bd2638, inset 4px 3px #ff8a8e;
  }
  #apple::before {
    content: ""; position: absolute; width: 5px; height: 10px; background: #6a9c42;
    border-radius: 5px 0 5px 0; top: -7px; left: 15px; transform: rotate(28deg);
  }
  #apple::after {
    content: ""; position: absolute; width: 3px; height: 8px; background: #75502c;
    top: -5px; left: 13px; transform: rotate(-12deg);
  }
  .controls { display: flex; justify-content: center; gap: 10px; margin: 16px 0 8px; flex-wrap: wrap; }
  button {
    border: 0; border-radius: 10px; padding: 11px 20px; font-size: 15px; font-weight: 700;
    cursor: pointer; transition: transform .12s, filter .12s;
  }
  button:hover { filter: brightness(1.05); transform: translateY(-1px); }
  #startBtn { background: #2457c5; color: white; }
  #pauseBtn { background: #e5ebf5; color: #243047; }
  .help { font-size: 14px; line-height: 1.5; color: #586579; margin: 10px auto 0; }
  .message { min-height: 24px; margin-top: 8px; font-weight: 700; color: #2457c5; }
  @media (max-width: 540px) {
    body { padding: 12px; }
    #game-container { height: min(400px, 78vw); }
    #basket { bottom: 12px; }
  }
</style>
</head>
<body>
<main class="page">
  <h1>Bài tập 36 - Mini game web</h1>
  <p class="subtitle">Hứng táo 🍎 — di chuyển giỏ để ghi điểm!</p>

  <div class="status" aria-live="polite">
    <div class="pill">Điểm số: <span id="score">0</span></div>
    <div class="pill">Mạng sống: <span id="lives">3</span></div>
  </div>

  <div id="game-container" aria-label="Khu vực trò chơi">
    <div id="apple" aria-label="Quả táo"></div>
    <div id="basket" aria-label="Cái giỏ"></div>
  </div>

  <div class="controls">
    <button id="startBtn" type="button">Bắt đầu</button>
    <button id="pauseBtn" type="button">Tạm dừng</button>
  </div>
  <p class="help">Dùng phím <b>←</b> và <b>→</b> để di chuyển giỏ. Hứng được táo: +1 điểm. Để táo rơi xuống đất: mất 1 mạng.</p>
  <div id="message" class="message" role="status">Nhấn “Bắt đầu” để chơi.</div>
</main>

<script>
(() => {
  const game = document.getElementById('game-container');
  const basket = document.getElementById('basket');
  const apple = document.getElementById('apple');
  const scoreEl = document.getElementById('score');
  const livesEl = document.getElementById('lives');
  const message = document.getElementById('message');
  const startBtn = document.getElementById('startBtn');
  const pauseBtn = document.getElementById('pauseBtn');

  const GAME_WIDTH = 500;
  const BASKET_WIDTH = 76;
  const APPLE_SIZE = 28;
  let basketX = (GAME_WIDTH - BASKET_WIDTH) / 2;
  let appleX = 0, appleY = 0;
  let score = 0, lives = 3, speed = 2.2;
  let running = false, gameOver = false, animationId = null;
  let lastTime = 0;

  function placeBasket() {
    const width = game.clientWidth;
    basket.style.left = `${Math.max(0, Math.min(width - BASKET_WIDTH, basketX))}px`;
  }
  function resetApple() {
    const width = game.clientWidth;
    appleX = Math.random() * Math.max(1, width - APPLE_SIZE);
    appleY = -APPLE_SIZE - Math.random() * 80;
    apple.style.left = `${appleX}px`;
    apple.style.top = `${appleY}px`;
  }
  function updateHud() {
    scoreEl.textContent = score;
    livesEl.textContent = lives;
  }
  function startGame() {
    if (animationId) cancelAnimationFrame(animationId);
    score = 0; lives = 3; speed = 2.2; gameOver = false; running = true;
    basketX = (game.clientWidth - BASKET_WIDTH) / 2;
    placeBasket(); resetApple(); updateHud();
    message.textContent = 'Cố lên! Hãy hứng táo.';
    lastTime = 0;
    animationId = requestAnimationFrame(loop);
  }
  function endGame() {
    running = false; gameOver = true;
    if (animationId) cancelAnimationFrame(animationId);
    animationId = null;
    message.textContent = `Game Over! Bạn đạt ${score} điểm. Nhấn “Bắt đầu” để chơi lại.`;
  }
  function loop(timestamp) {
    if (!running) return;
    if (!lastTime) lastTime = timestamp;
    const delta = Math.min((timestamp - lastTime) / 16.67, 2.5);
    lastTime = timestamp;
    appleY += speed * delta;
    apple.style.top = `${appleY}px`;

    const basketTop = game.clientHeight - 12 - 32;
    const basketRight = basketX + BASKET_WIDTH;
    const appleRight = appleX + APPLE_SIZE;
    const touchingBasket = appleY + APPLE_SIZE >= basketTop &&
      appleY <= basketTop + 32 && appleRight >= basketX && appleX <= basketRight;

    if (touchingBasket) {
      score++;
      speed = Math.min(speed + 0.18, 7);
      updateHud();
      resetApple();
    } else if (appleY + APPLE_SIZE >= game.clientHeight - 2) {
      lives--;
      updateHud();
      if (lives <= 0) { endGame(); return; }
      message.textContent = 'Ôi, táo đã rơi! Bạn còn ' + lives + ' mạng.';
      resetApple();
    }
    animationId = requestAnimationFrame(loop);
  }
  function moveBasket(direction) {
    if (!running) return;
    basketX += direction * 28;
    basketX = Math.max(0, Math.min(game.clientWidth - BASKET_WIDTH, basketX));
    placeBasket();
  }
  document.addEventListener('keydown', (event) => {
    if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') event.preventDefault();
    if (event.key === 'ArrowLeft') moveBasket(-1);
    if (event.key === 'ArrowRight') moveBasket(1);
  });
  startBtn.addEventListener('click', startGame);
  pauseBtn.addEventListener('click', () => {
    if (running) {
      running = false;
      if (animationId) cancelAnimationFrame(animationId);
      animationId = null;
      message.textContent = 'Đã tạm dừng. Nhấn “Bắt đầu” để chơi lại từ đầu.';
      pauseBtn.textContent = 'Tạm dừng';
    } else if (!gameOver) {
      message.textContent = 'Nhấn “Bắt đầu” để tiếp tục một ván mới.';
    }
  });
  window.addEventListener('resize', () => {
    basketX = Math.max(0, Math.min(game.clientWidth - BASKET_WIDTH, basketX));
    placeBasket();
    appleX = Math.min(appleX, game.clientWidth - APPLE_SIZE);
    apple.style.left = `${appleX}px`;
  });
  placeBasket();
  resetApple();
})();
</script>
</body>
</html>
